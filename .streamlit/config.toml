[server]
address = "127.0.0.1"
headless = true
maxUploadSize = 20
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#087f72"
backgroundColor = "#fcfdfc"
secondaryBackgroundColor = "#f0f5f2"
textColor = "#19332e"
borderColor = "#dbe6df"
font = "sans-serif"
baseRadius = "12px"
buttonRadius = "8px"
showWidgetBorder = true
headingFontWeights = [650, 600, 600, 600, 600, 600]
paddingTop = "1.5rem"
paddingBottom = "2rem"
